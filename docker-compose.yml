version: '3.8'

services:
  # MongoDB Database Service
  db:
    image: mongo:6.0
    container_name: fundus-mongo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fundus-backend-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: "mongodb://db:27017/fundus_db"
      PORT: 3000
    depends_on:
      - db
    # Start the compiled Node.js backend
    command: node dist/index.js

volumes:
  mongo_data:
